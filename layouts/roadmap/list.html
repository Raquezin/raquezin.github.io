{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="content">
  {{ .Content }}

  <div class="roadmap-tree">
    {{- range $y := sort hugo.Data.roadmap.years "year" "desc" }}
    <details class="roadmap-year" open>
      <summary class="roadmap-year-label">{{ $y.year }}/</summary>
      <ul class="roadmap-entries">
        {{- range collections.Reverse $y.events }}{{ partial "roadmap_entry.html" (dict "entry" .) }}{{ end }}
      </ul>
    </details>
    {{- end }}
  </div>
</div>
{{ end }}
